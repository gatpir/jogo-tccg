
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Trunfo: Reino Animal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            text-align: center;
        }

        .scoreboard {
            font-size: 1.1em;
            margin-bottom: 20px;
            background-color: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        .board {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .area-titulo {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #aaa;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .card {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border: 4px solid #bdc3c7;
            border-radius: 15px;
            width: 260px;
            padding: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            min-height: 330px;
        }

        .card.super-trunfo {
            border-color: #ffcc00;
            background: linear-gradient(135deg, #b8860b, #996515);
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.4);
        }

        .card.hidden-card {
            background: repeating-linear-gradient(
                45deg,
                #2c3e50,
                #2c3e50 10px,
                #1a252f 10px,
                #1a252f 20px
            );
            border-color: #7f8c8d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card.hidden-card .back-pattern {
            font-size: 5em;
            opacity: 0.3;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 1.1em;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .card-id {
            background-color: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .super-badge {
            background-color: #ffcc00;
            color: #000;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .card-image {
            font-size: 70px;
            text-align: center;
            margin: 15px 0;
            background-color: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
        }

        .attributes {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .attribute-button {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .attribute-button:hover:not(:disabled) {
            background: #ffcc00;
            color: black;
        }

        .attribute-button:disabled {
            cursor: default;
        }

        .attribute-button.selected {
            background: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        .controls {
            text-align: center;
            margin-top: 10px;
        }

        .btn {
            background-color: #ffcc00;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
            margin: 5px;
        }

        .btn:hover {
            background-color: #ffe066;
        }

        .log {
            margin-top: 20px;
            max-width: 520px;
            text-align: center;
            font-size: 1.1em;
            line-height: 1.5;
            color: #ffcc00;
            min-height: 50px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 1.5em;
            }

            .board {
                gap: 20px;
            }

            .card {
                width: min(280px, 90vw);
            }
        }
    </style>
</head>

<body>

    <h1>🎴 Super Trunfo: Reino Animal 🦁</h1>

    <div class="scoreboard">
        Sua mão: <span id="player-count">0</span> cartas |
        Computador: <span id="cpu-count">0</span> cartas
    </div>

    <div class="board">
        <div>
            <div class="area-titulo">Sua Carta</div>
            <div id="player-card-slot"></div>
        </div>

        <div>
            <div class="area-titulo">Carta do Computador</div>
            <div id="cpu-card-slot"></div>
        </div>
    </div>

    <div class="controls">
        <button id="next-btn" class="btn" onclick="proximaRodada()">
            Próxima Rodada
        </button>

        <button id="restart-btn" class="btn" onclick="iniciarJogo()">
            Jogar Novamente
        </button>
    </div>

    <div id="game-log" class="log">
        Escolha um atributo da sua carta para começar!
    </div>

    <script>
        const baralhoCompleto = [
            {
                id: "A1",
                nome: "Leão",
                emoji: "🦁",
                trunfo: true,
                peso: 190,
                velocidade: 80,
                ataque: 4,
                defesa: 4
            },
            {
                id: "A2",
                nome: "Guepardo",
                emoji: "🐆",
                trunfo: false,
                peso: 50,
                velocidade: 120,
                ataque: 3,
                defesa: 2
            },
            {
                id: "A3",
                nome: "Elefante",
                emoji: "🐘",
                trunfo: false,
                peso: 6000,
                velocidade: 40,
                ataque: 4,
                defesa: 5
            },
            {
                id: "B1",
                nome: "Crocodilo",
                emoji: "🐊",
                trunfo: false,
                peso: 500,
                velocidade: 35,
                ataque: 5,
                defesa: 4
            },
            {
                id: "B2",
                nome: "Gorila",
                emoji: "🦍",
                trunfo: false,
                peso: 160,
                velocidade: 40,
                ataque: 4,
                defesa: 4
            },
            {
                id: "B3",
                nome: "Hipopótamo",
                emoji: "🦛",
                trunfo: false,
                peso: 1500,
                velocidade: 30,
                ataque: 5,
                defesa: 5
            }
        ];

        let maoJogador = [];
        let maoCpu = [];

        let turnoJogador = true;
        let rodadaFinalizada = false;

        function embaralhar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));

                [array[i], array[j]] = [array[j], array[i]];
            }

            return array;
        }

        function iniciarJogo() {
            const baralho = embaralhar([...baralhoCompleto]);

            maoJogador = baralho.slice(0, 3);
            maoCpu = baralho.slice(3, 6);

            turnoJogador = true;
            rodadaFinalizada = false;

            document.getElementById("restart-btn").style.display = "none";
            document.getElementById("next-btn").style.display = "none";

            atualizarInterface();

            document.getElementById("game-log").innerHTML =
                "O jogo começou! Escolha um atributo na sua carta.";
        }

        function atualizarInterface() {
            document.getElementById("player-count").innerText = maoJogador.length;
            document.getElementById("cpu-count").innerText = maoCpu.length;

            if (maoJogador.length === 0 || maoCpu.length === 0) {
                finalizarJogo();
                return;
            }

            renderizarCartaJogador(maoJogador[0]);

            if (turnoJogador) {
                renderizarCartaCpuEscondida();
            } else {
                renderizarCartaCpuEscondida();

                document.getElementById("game-log").innerHTML =
                    "Turno do Computador! Ele está pensando...";

                setTimeout(jogadaComputador, 1200);
            }
        }

        function renderizarCartaJogador(carta) {
            const slot = document.getElementById("player-card-slot");

            const estrelasAtaque = "⚔️".repeat(carta.ataque);
            const estrelasDefesa = "🛡️".repeat(carta.defesa);

            slot.innerHTML = `
                <div class="card ${carta.trunfo ? 'super-trunfo' : ''}">

                    <div class="card-header">
                        <span>${carta.nome}</span>

                        ${carta.trunfo
                            ? '<span class="super-badge">Trunfo</span>'
                            : ''}

                        <span class="card-id">${carta.id}</span>
                    </div>

                    <div class="card-image">${carta.emoji}</div>

                    <div class="attributes">

                        <button class="attribute-button"
                            onclick="jogarAtributo('peso')">
                            <span>Peso</span>
                            <strong>${carta.peso} kg</strong>
                        </button>

                        <button class="attribute-button"
                            onclick="jogarAtributo('velocidade')">
                            <span>Velocidade</span>
                            <strong>${carta.velocidade} km/h</strong>
                        </button>

                        <button class="attribute-button"
                            onclick="jogarAtributo('ataque')">
                            <span>Ataque</span>
                            <strong>${estrelasAtaque}</strong>
                        </button>

                        <button class="attribute-button"
                            onclick="jogarAtributo('defesa')">
                            <span>Defesa</span>
                            <strong>${estrelasDefesa}</strong>
                        </button>

                    </div>
                </div>
            `;

            if (!turnoJogador) {
                desativarBotoesAtributo();
            }
        }

        function renderizarCartaCpuEscondida() {
            const slot = document.getElementById("cpu-card-slot");

            slot.innerHTML = `
                <div class="card hidden-card">
                    <div class="back-pattern">🐾</div>
                </div>
            `;
        }

        function desativarBotoesAtributo() {
            const botoes = document.querySelectorAll(
                "#player-card-slot .attribute-button"
            );

            botoes.forEach(botao => {
                botao.disabled = true;
            });
        }

        function jogadaComputador() {
            if (rodadaFinalizada || turnoJogador) return;

            if (maoCpu.length === 0 || maoJogador.length === 0) {
                finalizarJogo();
                return;
            }

            const cartaCpu = maoCpu[0];

            const atributos = [
                "peso",
                "velocidade",
                "ataque",
                "defesa"
            ];

            let melhorAtributo = atributos[
                Math.floor(Math.random() * atributos.length)
            ];

            let maiorValor = cartaCpu[melhorAtributo];

            atributos.forEach(atributo => {
                if (cartaCpu[atributo] > maiorValor) {
                    maiorValor = cartaCpu[atributo];
                    melhorAtributo = atributo;
                }
            });

            jogarAtributo(melhorAtributo);
        }

        function jogarAtributo(atributo) {
            if (rodadaFinalizada) return;

            if (!turnoJogador) {
                return;
            }

            rodadaFinalizada = true;

            desativarBotoesAtributo();

            const cartaJogador = maoJogador[0];
            const cartaCpu = maoCpu[0];

            revelarCartaCpu(cartaCpu, atributo);

            let logTexto = `
                Atributo escolhido:
                <strong>${atributo.toUpperCase()}</strong><br>
            `;

            let vencedor = "";

            // Regra do Super Trunfo
            if (cartaJogador.trunfo && !cartaCpu.trunfo) {
                vencedor = "jogador";

                logTexto += `
                    Seu <strong>Leão é o Super Trunfo!</strong>
                    Você ganhou a rodada automaticamente!
                `;

            } else if (cartaCpu.trunfo && !cartaJogador.trunfo) {
                vencedor = "cpu";

                logTexto += `
                    O Computador jogou o
                    <strong>Leão (Super Trunfo)!</strong>
                    Ele ganhou a rodada automaticamente!
                `;

            } else {
                const valJogador = cartaJogador[atributo];
                const valCpu = cartaCpu[atributo];

                if (valJogador > valCpu) {
                    vencedor = "jogador";

                    logTexto += `
                        Você venceu!
                        (${valJogador} vs ${valCpu})
                    `;

                } else if (valCpu > valJogador) {
                    vencedor = "cpu";

                    logTexto += `
                        O Computador venceu!
                        (${valCpu} vs ${valJogador})
                    `;

                } else {
                    vencedor = "empate";

                    logTexto += `
                        Empate!
                        Ambas as cartas tinham valor ${valJogador}.
                    `;
                }
            }

            // Distribuição das cartas
            if (vencedor === "jogador") {
                const cartaJogadorUsada = maoJogador.shift();
                const cartaCpuUsada = maoCpu.shift();

                maoJogador.push(cartaJogadorUsada);
                maoJogador.push(cartaCpuUsada);

                turnoJogador = true;

            } else if (vencedor === "cpu") {
                const cartaCpuUsada = maoCpu.shift();
                const cartaJogadorUsada = maoJogador.shift();

                maoCpu.push(cartaCpuUsada);
                maoCpu.push(cartaJogadorUsada);

                turnoJogador = false;

            } else {
                // Em caso de empate, as cartas ficam com seus donos.
                turnoJogador = true;
            }

            document.getElementById("game-log").innerHTML = logTexto;

            document.getElementById("next-btn").style.display =
                "inline-block";

            document.getElementById("player-count").innerText =
                maoJogador.length;

            document.getElementById("cpu-count").innerText =
                maoCpu.length;
        }

        function revelarCartaCpu(carta, atributoSelecionado) {
            const slot = document.getElementById("cpu-card-slot");

            const estrelasAtaque = "⚔️".repeat(carta.ataque);
            const estrelasDefesa = "🛡️".repeat(carta.defesa);

            slot.innerHTML = `
                <div class="card ${carta.trunfo ? 'super-trunfo' : ''}">

                    <div class="card-header">
                        <span>${carta.nome}</span>

                        ${carta.trunfo
                            ? '<span class="super-badge">Trunfo</span>'
                            : ''}

                        <span class="card-id">${carta.id}</span>
                    </div>

                    <div class="card-image">${carta.emoji}</div>

                    <div class="attributes">

                        <div class="attribute-button
                            ${atributoSelecionado === 'peso' ? 'selected' : ''}">
                            <span>Peso</span>
                            <strong>${carta.peso} kg</strong>
                        </div>

                        <div class="attribute-button
                            ${atributoSelecionado === 'velocidade' ? 'selected' : ''}">
                            <span>Velocidade</span>
                            <strong>${carta.velocidade} km/h</strong>
                        </div>

                        <div class="attribute-button
                            ${atributoSelecionado === 'ataque' ? 'selected' : ''}">
                            <span>Ataque</span>
                            <strong>${estrelasAtaque}</strong>
                        </div>

                        <div class="attribute-button
                            ${atributoSelecionado === 'defesa' ? 'selected' : ''}">
                            <span>Defesa</span>
                            <strong>${estrelasDefesa}</strong>
                        </div>

                    </div>
                </div>
            `;
        }

        function proximaRodada() {
            document.getElementById("next-btn").style.display = "none";

            rodadaFinalizada = false;

            atualizarInterface();

            if (maoJogador.length > 0 && maoCpu.length > 0) {
                if (turnoJogador) {
                    document.getElementById("game-log").innerHTML =
                        "Sua vez! Escolha um atributo.";
                }
            }
        }

        function finalizarJogo() {
            document.getElementById("player-card-slot").innerHTML = "";
            document.getElementById("cpu-card-slot").innerHTML = "";

            document.getElementById("next-btn").style.display = "none";
            document.getElementById("restart-btn").style.display =
                "inline-block";

            if (maoJogador.length === 0) {
                document.getElementById("game-log").innerHTML =
                    "Fim de Jogo! 😢 O Computador capturou todas as cartas e venceu.";

            } else {
                document.getElementById("game-log").innerHTML =
                    "🏆 Parabéns! Você capturou todas as cartas do Computador e venceu o Super Trunfo!";
            }
        }

        iniciarJogo();
    </script>

</body>
</html>
